<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0a0c0f" />
    <title>EchoSight</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ff9f0a' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z'/><path d='m8.5 8.5 7 7'/></svg>" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/src/styles/reset.css" />
    <link rel="stylesheet" href="/src/styles/sr-only.css" />
    <link rel="stylesheet" href="/src/styles/app.css" />
  </head>
  <body>
    <!-- ARIA Live Regions for TalkBack -->
    <div id="live-polite" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <div id="live-assertive" class="sr-only" aria-live="assertive" aria-atomic="true"></div>

    <div id="app-root">
      <!-- Top Bar -->
      <header class="top-bar">
        <div class="brand-badge" aria-label="EchoSight App">
          <span class="brand-pill-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/>
              <path d="m8.5 8.5 7 7"/>
            </svg>
          </span>
          <span class="brand-title">EchoSight</span>
        </div>
        <div class="top-bar-actions">
          <button id="sound-btn" class="icon-btn" aria-label="Toggle Audio Guidance Tone" title="Toggle Sound Tone">
            <span id="sound-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
              </svg>
            </span>
          </button>
          <button id="settings-btn" class="icon-btn" aria-label="Settings and Preferences" title="Settings">
            <span id="settings-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
            </span>
          </button>
        </div>
      </header>

      <!-- Mode Toggle (Document / Medicine) -->
      <div id="mode-toggle" role="radiogroup" aria-label="Select reading mode" class="mode-toggle">
        <button role="radio" aria-checked="false" data-mode="document"
                class="mode-btn" tabindex="0">
          <span class="mode-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
            </svg>
          </span>
          <span>Document</span>
        </button>
        <button role="radio" aria-checked="true" data-mode="medicine"
                class="mode-btn mode-btn--active" tabindex="0">
          <span class="mode-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/>
              <path d="m8.5 8.5 7 7"/>
            </svg>
          </span>
          <span>Medicine</span>
        </button>
      </div>

      <!-- Camera Viewport & Assistive Scanner HUD -->
      <main class="camera-container" id="camera-container">
        <video id="camera" autoplay playsinline muted></video>
        
        <!-- Corner Reticle HUD with Laser Scan Line -->
        <div id="scanner-reticle" class="scanner-reticle" aria-hidden="true">
          <div class="reticle-corner corner--tl"></div>
          <div class="reticle-corner corner--tr"></div>
          <div class="reticle-corner corner--bl"></div>
          <div class="reticle-corner corner--br"></div>
          <div id="scanner-laser" class="scanner-laser" hidden></div>
        </div>

        <div id="focus-ring" class="focus-ring" hidden></div>

        <button id="torch-btn" class="torch-btn" aria-label="Toggle Flashlight" title="Toggle Flashlight">
          <span id="torch-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 6c0 2-2 4-2 7v6a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2v-6c0-3-2-5-2-7a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2Z"/>
              <line x1="6" y1="6" x2="18" y2="6"/>
              <line x1="12" y1="12" x2="12" y2="12.01"/>
            </svg>
          </span>
        </button>

        <div id="visual-toast" class="visual-toast" hidden>
          <span id="toast-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
            </svg>
          </span>
          <span id="toast-msg">Hold steady...</span>
        </div>
      </main>

      <!-- Bottom Panel / Clinical Readout Sheet -->
      <footer class="bottom-panel">
        <div id="results-card" class="results-sheet" hidden>
          <div class="result-header">
            <div class="result-title-group">
              <span class="result-category-label">Identified Medicine</span>
              <h2 id="res-brand">Brand Name</h2>
            </div>
            <span id="res-status" class="status-badge">Valid</span>
          </div>

          <!-- Structured Metadata Chips Grid -->
          <div class="res-chips-grid">
            <div class="res-chip" id="chip-dosage">
              <span class="chip-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/>
                  <path d="m8.5 8.5 7 7"/>
                </svg>
              </span>
              <div class="chip-content">
                <span class="chip-label">Dosage / Strength</span>
                <span id="res-strength" class="chip-value">--</span>
              </div>
            </div>
            <div class="res-chip" id="chip-expiry">
              <span class="chip-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                  <line x1="16" y1="2" x2="16" y2="6"/>
                  <line x1="8" y1="2" x2="8" y2="6"/>
                  <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
              </span>
              <div class="chip-content">
                <span class="chip-label">Expiry Date</span>
                <span id="res-expiry" class="chip-value">--</span>
              </div>
            </div>
          </div>

          <!-- Collapsible Clinical Guide -->
          <details id="res-accordion" class="res-accordion" hidden>
            <summary class="res-accordion-summary">
              <span class="accordion-title-wrap">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <circle cx="12" cy="12" r="10"/>
                  <line x1="12" y1="16" x2="12" y2="12"/>
                  <line x1="12" y1="8" x2="12.01" y2="8"/>
                </svg>
                <span>Clinical Usage & Instructions</span>
              </span>
              <span class="accordion-arrow">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polyline points="6 9 12 15 18 9"/>
                </svg>
              </span>
            </summary>
            <div id="res-description" class="res-description"></div>
          </details>

          <!-- Quick Action Toolbar -->
          <div class="res-actions-toolbar">
            <button id="res-replay-btn" class="btn-secondary" aria-label="Replay Voice Summary">
              <span class="btn-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                  <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                  <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                </svg>
              </span>
              <span>Replay Voice</span>
            </button>
            <button id="res-copy-btn" class="btn-secondary" aria-label="Copy Medicine Details">
              <span class="btn-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                </svg>
              </span>
              <span>Copy Info</span>
            </button>
          </div>
        </div>
        
        <button id="scan-trigger" class="btn-primary" aria-describedby="scan-instructions">
          <span id="scan-btn-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
            </svg>
          </span>
          <span id="scan-btn-text">Start Scan</span>
        </button>
        <div id="scan-instructions" class="sr-only">Double-tap screen or press Bluetooth trigger to scan.</div>
      </footer>
    </div>

    <!-- Modals -->
    <div id="settings-screen" hidden></div>
    <div id="about-screen" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
